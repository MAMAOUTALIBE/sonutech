components:
  schemas:
    Audit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 30
        resource:
          type: string
          maxLength: 100
        object_id:
          type: string
          maxLength: 80
        changed_fields: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
      required:
      - action
      - created_at
      - id
      - object_id
      - resource
    BlankEnum:
      enum:
      - ''
    CSRF:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 180
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 500
        body:
          type: string
        image:
          type: string
          maxLength: 500
        image_alt:
          type: string
          maxLength: 250
        seo_title:
          type: string
          maxLength: 180
        seo_description:
          type: string
          maxLength: 300
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        published:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
        category:
          type: string
          maxLength: 80
        objectives: {}
        audience: {}
        prerequisites: {}
        program: {}
        duration:
          type: string
          maxLength: 100
        modality:
          type: string
          maxLength: 150
      required:
      - category
      - description
      - duration
      - id
      - modality
      - slug
      - title
      - updated_at
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - id
      - permissions
      - username
    DecidedViaEnum:
      enum:
      - auto
      - email_link
      - api
      type: string
      description: |-
        * `auto` - Automatique
        * `email_link` - Lien de validation
        * `api` - API de gestion
    Decision:
      type: object
      properties:
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 6000
    Draft:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          readOnly: true
          default: 0
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 6000
        status:
          allOf:
          - $ref: '#/components/schemas/DraftStatusEnum'
          readOnly: true
        due_at:
          type: string
          format: date-time
          readOnly: true
        approval_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        approval_requested_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decided_via:
          allOf:
          - $ref: '#/components/schemas/DecidedViaEnum'
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        send_attempts:
          type: integer
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        inquiry:
          type: string
          format: uuid
          readOnly: true
        lead:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        decided_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - approval_expires_at
      - approval_requested_at
      - body
      - created_at
