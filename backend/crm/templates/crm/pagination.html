{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if page_obj.has_previous %}<a class="button secondary small" href="?page={{ page_obj.previous_page_number }}&amp;q={{ q|urlencode }}&amp;stage={{ stage|urlencode }}&amp;filter={{ filter|urlencode }}">← Précédent</a>{% endif %}<span>Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button secondary small" href="?page={{ page_obj.next_page_number }}&amp;q={{ q|urlencode }}&amp;stage={{ stage|urlencode }}&amp;filter={{ filter|urlencode }}">Suivant →</a>{% endif %}</nav>{% endif %}
