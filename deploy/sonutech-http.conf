# Bootstrap HTTP entrypoint for Let's Encrypt. Replace after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name sonutech.fr www.sonutech.fr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 503;
    }
}
