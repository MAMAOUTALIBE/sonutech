server {
    listen 80;
    listen [::]:80;
    server_name sonutech.fr www.sonutech.fr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://sonutech.fr$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sonutech.fr;
    ssl_certificate /etc/letsencrypt/live/sonutech.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonutech.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://sonutech.fr$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sonutech.fr;
    ssl_certificate /etc/letsencrypt/live/sonutech.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonutech.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /media/ {
        alias /opt/sonutech/var/media/;
        autoindex off;
        limit_except GET HEAD { deny all; }
    }
    location /static/ {
        alias /opt/sonutech/var/static/;
        autoindex off;
        limit_except GET HEAD { deny all; }
    }
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Sonutech-Proxy-Secret "";
    proxy_set_header X-Sonutech-Client-IP "";
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8400;
    }
    location = /crm {
        proxy_pass http://127.0.0.1:3400;
    }
    location ~ ^/crm/(connexion|deconnexion|activer|assistant|brouillons)(/|$) {
        proxy_pass http://127.0.0.1:8400;
    }
    location ~ ^/crm/prospects/[0-9a-f-]+/assistant/ {
        proxy_pass http://127.0.0.1:8400;
    }
    location /crm/ {
        proxy_pass http://127.0.0.1:3400;
    }
    location / {
        proxy_pass http://127.0.0.1:3400;
    }
}
