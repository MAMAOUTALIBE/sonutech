name: sonutech
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonutech
      POSTGRES_USER: sonutech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonutech -d sonutech"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://sonutech:${POSTGRES_PASSWORD}@db:5432/sonutech
      CHATBOT_SECRET_FILE: /app/private/groq.json
      CRM_DOCUMENT_ROOT: /app/private/documents
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8400:8000"
    volumes:
      - ./var/media:/app/media
      - ./var/static:/app/staticfiles
      - ./var/private:/app/private
    restart: unless-stopped
  assistant:
    image: sonutech-backend:latest
    command: ["python", "manage.py", "run_chatbot_agent", "--interval", "60"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://sonutech:${POSTGRES_PASSWORD}@db:5432/sonutech
      CHATBOT_SECRET_FILE: /app/private/groq.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./var/private:/app/private:ro
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      MEDIA_ROOT: /app/media
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Missing PROXY_SHARED_SECRET}
      TRUST_PROXY_HEADERS: "1"
      NEXT_PUBLIC_SITE_URL: https://sonutech.fr
      SITE_URL: https://sonutech.fr
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3400:3000"
    volumes:
      - ./var/media:/app/media:ro
    restart: unless-stopped
volumes:
  postgres_data:
