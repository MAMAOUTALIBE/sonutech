name: sonutech
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonutech
      POSTGRES_USER: sonutech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonutech -d sonutech"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sonutech:${POSTGRES_PASSWORD}@db:5432/sonutech
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    restart: unless-stopped
  agent:
    build: ./backend
    command: ["python", "manage.py", "run_agent"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sonutech:${POSTGRES_PASSWORD}@db:5432/sonutech
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      MEDIA_ROOT: /app/media
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - media_data:/app/media:ro
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  postgres_data:
  media_data:
  static_data:
